# Project-local arduino-cli config: keeps the ESP32 core and libraries used for
# checking the solutions inside .arduino/ instead of touching your global install.
board_manager:
  additional_urls:
    - https://espressif.github.io/arduino-esp32/package_esp32_index.json
directories:
  data: .arduino/data
  downloads: .arduino/downloads
  user: .arduino/sketchbook
library:
  enable_unsafe_install: false
